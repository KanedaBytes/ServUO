
# Maximum number of LoopQueue callbacks drained per game-loop tick.
# Work beyond the budget stays queued for the next tick, so a burst from a background
# producer (the admin API) can never stall the game loop. Mirrors ServUO's Timer.BreakCount.
# Default: 256
LoopQueueBudget=256

# Milliseconds between LoopQueue drain passes.
# The drain timer runs at TimerPriority.EveryTick, so this is a floor, not a guarantee.
# Default: 50
LoopQueueIntervalMs=50

# Run [CoreSmoke automatically once the server has started.
# ServUO's console cannot invoke staff commands, so this is the only way to run the smoke
# test headlessly (verifying a build over SSH, or in CI). Leave false on a live shard.
# Default: False
CoreSmokeOnStart=False

# Count matching backpack items toward an active quest ObtainObjective automatically.
# When False, players must use "Toggle Quest Item" on their paperdoll and target each stack,
# which is stock ServUO behaviour. Applies shard-wide, to stock quests as well as custom ones.
# Default: True
AutoCollectEnabled=True

# Seconds between "N matching item(s) were not counted automatically" notices, per player.
# Auto-collect sweeps once a second, so without a throttle the notice would repeat at 1 Hz for
# as long as the player carries an item the safety filter rejects.
# Default: 60
AutoCollectNoticeSeconds=60

# Maximum authored navigation edge length, in tiles (Chebyshev).
# ServUO's FastAStarAlgorithm searches a 38x38 box centred on the MIDPOINT of start and goal,
# so a hop whose real detour leaves that box cannot be pathed at all and the mobile walks into
# scenery instead of failing loudly. The ModernUO shard settled on 15 for route legs for the
# same reason; 12 keeps margin. Over-cap edges are a warning, not an error.
# Default: 12
NavHopMaxTiles=12

# Tiles walked between automatic waypoint drops while [NavRecord is on.
# Default: 8
NavRecordIntervalTiles=8

# Default radius for [NavDebug markers, in tiles.
# Default: 32
NavDebugRadius=32

# How long [NavDebug markers survive before deleting themselves, in minutes.
# Default: 5
NavDebugMarkerMinutes=5

# What one tile of each kind of ground costs the corridor tool's search, relative to the others.
# A road is no shorter than the grass beside it, but it is where a road GOES - a corridor laid
# across open country is one nobody would ever have walked. These weight the search rather than
# restricting it, so it still crosses a field when a field is the only way through; it just will
# not do so to save two tiles. Ground is classified by its land tile's NAME from the client's
# tiledata, which is the same source [BotOreSweep uses. Anything unclassified costs Other.
# Default: 1
NavRoadCostRoad=1
# Default: 3
NavRoadCostGrass=3
# Default: 3
NavRoadCostSand=3
# Default: 4
NavRoadCostForest=4
# Default: 3
NavRoadCostOther=3

# Radius, in tiles, of the random offset applied to a non-exclusive arrival point.
# Stops several mobiles converging on one tile without needing a claim/release registry.
# Default: 2
NavArrivalScatter=2

# Routes cached before the whole cache is dropped. No LRU by design.
# Default: 512
NavRouteCacheMax=512

# Run [NavAudit automatically once the server has started.
# It pathfinds every walk edge against real map data, which is far too costly for a health
# check but is the only way to verify seed coordinates headlessly. Leave false on a live shard.
# Default: False
NavAuditOnStart=False

# How many probe walkers [WalkAudit runs at once.
# The walk audit asks real walkers to walk every edge and every arrival, which [NavAudit cannot
# do - it pathfinds with a Point3D from the authored waypoint, and a walker starts wherever its
# last hop stopped. The work is wall-clock-bound rather than CPU-bound (a probe spends its time
# waiting for step delays at mounted pace), so more probes is close to linearly faster until they
# start meeting each other. Clamped to 1..64.
# Default: 12
WalkAuditProbes=12

# How long one walk in [WalkAudit is given before it is recorded as a timeout.
# The recovery ladder runs normally during an audit - a pass that took three rungs is a different
# fact from a clean pass, and both are recorded - but a walker that never reaches the top rung
# would otherwise hold a probe indefinitely.
# This must be longer than a full ladder turn or it changes what the audit can SAY: the ladder is
# five rungs twenty seconds apart, so a walk that is going to give up needs a hundred seconds, and
# a shorter deadline files every hard failure under "the clock ran out" instead of naming a cause.
# 120 is also the frozen watchdog's window, which is the same quantity asked from the other side.
# Minimum 10.
# Default: 120
WalkAuditWalkSeconds=120

# Run [DailyLifeSmoke automatically once the server has started.
# It forces a full dusk->night->dawn->day cycle, checks the town reacts, and restores the clock.
# ServUO's console cannot invoke staff commands, so this is the only way to run it headlessly.
# Leave false on a live shard: it spawns and despawns the tavern crowd and the night watch.
# Default: False
DailyLifeSmokeOnStart=False

# Run [BotSmoke automatically once the server has started.
# It spawns one bot per class at Grandmaster, checks every skill and stat against the caps in
# force (Config/PlayerCaps.cfg, unless Data/Custom/bots.json overrides them), and deletes them.
# ServUO's console cannot invoke staff commands, so this is the only way to verify headlessly
# that the bot templates still respect the shard's caps. Cheap and self-cleaning, but it does
# briefly place mobiles in the world. Default: False
BotSmokeOnStart=False

# How many of the audited bots [BotSmoke leaves standing instead of deleting.
# A verification aid, not a feature: checking that a bot reaches the editor's live layer, and
# that it does NOT survive a restart, both need a bot that is still alive when the snapshot is
# written and when the world saves - and there is no way to spawn one from the console. Leave
# at 0 on a live shard. Bots left this way still delete themselves on the next restart.
# Default: 0
BotSmokeKeep=0

# Run [BotWorkScout automatically once the server has started.
# An AUTHORING tool, not a runtime one. It sweeps for mine and lumber sites near Britain and
# the walkable roads to them - asking the engine the same questions the runtime asks, which is
# the whole point of it - and writes Data/Live/work-scout.json for a human to merge into
# Data/Custom/navigation.json. It never edits the navigation data itself. Turn it on when a
# site needs re-deriving or a new one adding, and off again afterwards.
# Default: False
BotWorkScoutOnStart=False

# Run the work probe on its own once the server has started.
# The same probe [BotSmoke runs last, without the six minutes of walk, lifecycle and chat
# probes that precede it there. A Miner mines a real face, hauls the load to a Smith, and the
# Smith turns it into a crafted item; it reports through Bots.Shift. It spawns two bots and a
# pack animal for about seven minutes and cleans up after itself.
# Default: False
BotWorkProbeOnStart=False

# Run [BotSiteAudit automatically once the server has started.
# A diagnostic: prints the real land tile, statics, walkability and water flag under every
# work-site arrival point and corridor waypoint, and writes Data/Live/site-audit.json.
# Reads only - it spawns nothing and changes nothing.
# Default: False
BotSiteAuditOnStart=False

# How many harvestable tiles an authored work site's best arrival point must be able to reach
# before Nav.Data stops warning about it.
# Measured with the same 5x5 sweep BotHarvest.FindTarget performs, so it answers the only question
# that matters: standing there, will a bot find something to swing at? It exists because
# "HarvestDefinition.Validate accepted the tile" turned out to mean almost nothing - stock ServUO's
# mountain list contains land ids this client's tiledata names 'forest', and a whole set of mine
# sites was once authored on them. Thin sites WARN; sites with nothing at all are excluded outright.
# Default: 5
BotWorkSiteMinReach=5

# The same floor, per site type, because rock and wood are not the same question.
# A mine face saturates - the authored ones reach 11 to 15 - so 5 is a low bar there and still
# catches a site authored on the wrong tiles. A wood does not: Britain is not ringed by dense
# forest, so the Britain wood reaches 4 and is a perfectly good place to send a Lumberjack. One
# number for both meant either warning about a legitimate wood for ever, or lowering the bar for
# rock until it caught nothing. A type with no key of its own falls back to BotWorkSiteMinReach.
# Default: 5
BotWorkSiteMinReachMine=5
# Default: 3
BotWorkSiteMinReachLumber=3

# How long a gatherer spends trying to get inside its work site before it gives up and travels on.
# The clock only runs while the bot is NOT being steered by a walker: NavWalker aims the last step
# of a route at an exact tile and its recovery ladder can legitimately take 80-100 seconds on a
# contended approach, so a flat budget raced the ladder and cancelled recoveries that were about to
# succeed. This bounds the time spent standing about, which is what it was always meant to bound.
# Default: 75
BotWalkInSeconds=75

# Seconds between behaviour ticks.
# The tick makes DECISIONS - pick a destination, notice a walk that ended without arriving.
# It does not move anything: NavWalker has driven movement on its own timer since step 4a.
# Default: 2
BotTickSeconds=2

# How many bots may plan a route in a single behaviour tick.
# The budget is on planning, not on ticking. Ticking a bot is a switch on an enum; picking a
# destination and building a route walks the navigation graph. A bot refused a plan this tick
# simply asks again on the next one.
# Default: 8
BotPlansPerTick=8

# Seconds between lifecycle passes - how often a bot whose phase has expired rolls a new one.
# It rides the behaviour tick's own scan of the registry rather than taking a second walk of it,
# so this is a floor: the pass happens on the first behaviour tick after the interval elapses.
# Default: 60
BotLifecycleSeconds=60

# Seconds between writes of Data/Live/spawners.json, which is what the editor's spawner
# layer reads to show running state, current count and next spawn. Finding spawners means
# walking World.Items - there is no index - so this is deliberately slow, matching the
# health snapshot. Spawner state does not change faster: MinDelay and MaxDelay are in
# minutes. A save writes one immediately regardless, so the editor never waits for this.
# 0 turns it off.

SpawnerSnapshotSeconds=60

# Fill every bot spawner the moment the server has started, rather than letting each one wait
# out its own five-to-fifteen minute respawn timer.
# Bots never survive a restart - PlayerBot.Deserialize deletes them on load - so without this
# a restarted shard has its spawners but no bots in them, and takes a quarter of an hour to
# look inhabited again. Off is for measuring a boot without a population in the way.
# Default: True
BotPopulationFillOnStart=True

# Run the daily logon/logoff curve.
# On, the lifecycle half of the population rises and falls with the local hour: a bot plays for
# one to four hours, says goodbye and vanishes, and its spawner refills the slot only as the
# curve allows. Off pins the population at whatever the spawners hold, which is what the probes
# want when they need it to stand still. FIXED-ROLE bots - the bank crowds and the staffed
# benches - are outside the curve either way and are there at every hour.
# Default: True
BotSessionsEnabled=True

# Seconds between passes of the session curve.
# It rides BotTickManager s scan rather than a timer of its own, so this is the accumulator it
# waits on and not a cadence of its own - the same arrangement BotLifecycleSeconds has.
# Default: 60
BotSessionSeconds=60
