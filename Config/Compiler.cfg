# Forces scripts to be compiled at runtime.
# This is a legacy feature that was originally provided by the core.
#
# THIS SHARD SETS THIS TO FALSE. ScriptCompiler.Compile() does not check the exit code of the
# `dotnet build` it shells out to, so a failed script build silently loads the previous, stale
# Scripts.dll and the server boots as if nothing were wrong. Build with build.ps1 / build.sh
# instead - they check the exit code and refuse to launch a server whose scripts did not build.
Dynamic=False
